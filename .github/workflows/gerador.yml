name: Gerador de Recomendações Automático

on:
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write # Permissão para salvar o PDF final na pasta Saida

jobs:
  juntar_pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Gerador
        run: python main.py

      - name: Salvar PDFs na pasta Saída
        run: |
          git config --global user.name "Robo Recomendacoes"
          git config --global user.email "robo@github.com"
          git fetch origin main
          git pull origin main --rebase || echo "Sem conflitos"
          git add .
          git commit -m "Novos PDFs de recomendação gerados [Automático]" || echo "Sem mudanças"
          git push origin main
